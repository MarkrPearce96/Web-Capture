name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Import signing certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      - name: Build (signed with a personal Apple Development certificate)
        run: |
          xcodebuild \
            -project "xcode/Web Capture/Web Capture.xcodeproj" \
            -scheme "Web Capture" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM=62P4GYN8E3 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            CODE_SIGN_ENTITLEMENTS="$(pwd)/xcode/ci-release.entitlements" \
            build

      - name: Verify signing chain and entitlements
        run: |
          APP_PATH="build/Build/Products/Release/Web Capture.app"
          SIGNING_INFO=$(codesign -dvvv "$APP_PATH" 2>&1)
          if ! echo "$SIGNING_INFO" | grep -q "Authority=Apple Root CA"; then
            echo "Built app is not signed by a real Apple-issued certificate chain (Safari refuses to register extensions signed ad-hoc or self-signed)" >&2
            echo "$SIGNING_INFO" >&2
            exit 1
          fi
          ENTITLEMENTS=$(codesign -d --entitlements - --xml "$APP_PATH" 2>/dev/null)
          if [ -z "$ENTITLEMENTS" ]; then
            echo "Built app has NO entitlements at all — signing produced an unsandboxed binary" >&2
            exit 1
          fi
          if ! echo "$ENTITLEMENTS" | grep -A1 "<key>com.apple.security.app-sandbox</key>" | grep -q "<true/>"; then
            echo "Built app is missing com.apple.security.app-sandbox=true" >&2
            echo "$ENTITLEMENTS" >&2
            exit 1
          fi
          if echo "$ENTITLEMENTS" | grep -A1 "<key>com.apple.security.get-task-allow</key>" | grep -q "<true/>"; then
            echo "Built app has com.apple.security.get-task-allow=true (debug entitlement should not ship)" >&2
            exit 1
          fi

      - name: Verify built version matches the tag
        run: |
          APP_PATH="build/Build/Products/Release/Web Capture.app"
          TAG="${GITHUB_REF#refs/tags/v}"
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")
          if [ "$BUILT_VERSION" != "$TAG" ]; then
            echo "Tag is v$TAG but built app reports version $BUILT_VERSION (MARKETING_VERSION out of sync with the tag)" >&2
            exit 1
          fi

      - name: Zip the app
        run: |
          APP_PATH="build/Build/Products/Release/Web Capture.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH" >&2
            find build/Build/Products -maxdepth 3 >&2
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" WebCapture.zip
          TOP_ENTRY=$(unzip -Z1 WebCapture.zip | head -1)
          if [ "$TOP_ENTRY" != "Web Capture.app/" ]; then
            echo "Zip's top-level entry is '$TOP_ENTRY', expected 'Web Capture.app/'" >&2
            unzip -Z1 WebCapture.zip >&2
            exit 1
          fi

      - name: Compute sha256
        run: shasum -a 256 WebCapture.zip | tee sha256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" WebCapture.zip \
            --title "$TAG" \
            --generate-notes \
            --notes-file <(echo "sha256: $(cut -d' ' -f1 sha256.txt)")

      - name: Remove the temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
