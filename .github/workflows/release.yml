name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build (ad-hoc signed)
        run: |
          xcodebuild \
            -project "xcode/Web Capture/Web Capture.xcodeproj" \
            -scheme "Web Capture" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            CODE_SIGN_ENTITLEMENTS="xcode/ci-release.entitlements" \
            build

      - name: Verify entitlements are correct (sandboxed, no debug entitlement)
        run: |
          APP_PATH="build/Build/Products/Release/Web Capture.app"
          ENTITLEMENTS=$(codesign -d --entitlements - --xml "$APP_PATH" 2>/dev/null)
          if [ -z "$ENTITLEMENTS" ]; then
            echo "Built app has NO entitlements at all — signing produced an unsandboxed binary" >&2
            exit 1
          fi
          if ! echo "$ENTITLEMENTS" | grep -A1 "<key>com.apple.security.app-sandbox</key>" | grep -q "<true/>"; then
            echo "Built app is missing com.apple.security.app-sandbox=true" >&2
            echo "$ENTITLEMENTS" >&2
            exit 1
          fi
          if echo "$ENTITLEMENTS" | grep -A1 "<key>com.apple.security.get-task-allow</key>" | grep -q "<true/>"; then
            echo "Built app has com.apple.security.get-task-allow=true (debug entitlement should not ship)" >&2
            exit 1
          fi

      - name: Verify built version matches the tag
        run: |
          APP_PATH="build/Build/Products/Release/Web Capture.app"
          TAG="${GITHUB_REF#refs/tags/v}"
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")
          if [ "$BUILT_VERSION" != "$TAG" ]; then
            echo "Tag is v$TAG but built app reports version $BUILT_VERSION (MARKETING_VERSION out of sync with the tag)" >&2
            exit 1
          fi

      - name: Zip the app
        run: |
          APP_PATH="build/Build/Products/Release/Web Capture.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH" >&2
            find build/Build/Products -maxdepth 3 >&2
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" WebCapture.zip
          TOP_ENTRY=$(unzip -Z1 WebCapture.zip | head -1)
          if [ "$TOP_ENTRY" != "Web Capture.app/" ]; then
            echo "Zip's top-level entry is '$TOP_ENTRY', expected 'Web Capture.app/'" >&2
            unzip -Z1 WebCapture.zip >&2
            exit 1
          fi

      - name: Compute sha256
        run: shasum -a 256 WebCapture.zip | tee sha256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" WebCapture.zip \
            --title "$TAG" \
            --generate-notes \
            --notes-file <(echo "sha256: $(cut -d' ' -f1 sha256.txt)")
